<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="sh4" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="fsmArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e3a8a" />
    </marker>
  </defs>

  <!-- Initial state -->
  <circle cx="50" cy="140" r="12" fill="#0f172a" />
  <line x1="62" y1="140" x2="110" y2="140" stroke="#1e3a8a" stroke-width="2" marker-end="url(#fsmArr)"/>
  <text x="85" y="125" text-anchor="middle" font-size="10" fill="#64748b">Alim ON</text>

  <!-- State 1: Initialisation -->
  <g filter="url(#sh4)">
    <rect x="115" y="105" width="160" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="195" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Initialisation</text>
    <line x1="115" y1="145" x2="275" y2="145" stroke="#bfdbfe" stroke-width="1"/>
    <text x="125" y="162" font-size="10" fill="#3b82f6">entry / initUART()</text>
  </g>

  <!-- Transition 1 -> 2 -->
  <line x1="275" y1="140" x2="365" y2="140" stroke="#1e3a8a" stroke-width="2" marker-end="url(#fsmArr)"/>
  <text x="320" y="130" text-anchor="middle" font-size="10" font-weight="600" fill="#1e3a8a">Carte prête</text>

  <!-- State 2: AttenteConnexion -->
  <g filter="url(#sh4)">
    <rect x="370" y="105" width="180" height="70" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <text x="460" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#854d0e">AttenteConnexion</text>
    <line x1="370" y1="145" x2="550" y2="145" stroke="#fef08a" stroke-width="1"/>
    <text x="380" y="162" font-size="10" fill="#a16207">do / tenterDHCP()</text>
  </g>

  <!-- Transition 2 -> 3 -->
  <line x1="550" y1="140" x2="640" y2="140" stroke="#1e3a8a" stroke-width="2" marker-end="url(#fsmArr)"/>
  <text x="595" y="125" text-anchor="middle" font-size="10" font-weight="600" fill="#059669">[IP obtenue]</text>
  <text x="595" y="137" text-anchor="middle" font-size="10" fill="#059669">/ allumerLED()</text>

  <!-- State 3: Connecte -->
  <g filter="url(#sh4)">
    <rect x="645" y="105" width="160" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="725" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Connecté</text>
    <line x1="645" y1="145" x2="805" y2="145" stroke="#bbf7d0" stroke-width="1"/>
    <text x="655" y="162" font-size="10" fill="#15803d">do / ecouterSocket()</text>
  </g>

  <!-- Feedback: Perte de lien -->
  <path d="M 725 175 L 725 240 L 460 240 L 460 180" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#fsmArr)"/>
  <text x="595" y="255" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">Perte lien / allumerLEDRouge()</text>

  <!-- Final state -->
  <line x1="805" y1="140" x2="850" y2="140" stroke="#1e3a8a" stroke-width="2" marker-end="url(#fsmArr)"/>
  <circle cx="870" cy="140" r="14" fill="none" stroke="#0f172a" stroke-width="2"/>
  <circle cx="870" cy="140" r="8" fill="#0f172a"/>
</svg>