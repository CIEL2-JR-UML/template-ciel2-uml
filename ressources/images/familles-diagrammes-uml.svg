<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="sh" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">Le Trio Fondamental de l'UML (BTS CIEL 2)</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748b">Les 3 diagrammes indispensables pour concevoir et développer vos projets</text>

  <!-- Box 1: Use Case -->
  <g transform="translate(30, 90)" filter="url(#sh)">
    <rect x="0" y="0" width="260" height="250" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="45" rx="12" fill="#2563eb"/>
    <text x="130" y="28" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">1. Cas d'Utilisation</text>
    
    <text x="20" y="75" font-size="12" font-weight="700" fill="#1e3a8a">Rôle :</text>
    <text x="20" y="95" font-size="11" fill="#334155">Expression des besoins du point</text>
    <text x="20" y="110" font-size="11" fill="#334155">de vue des utilisateurs externes.</text>

    <text x="20" y="145" font-size="12" font-weight="700" fill="#1e3a8a">Éléments Clés :</text>
    <text x="20" y="165" font-size="11" fill="#334155">• Acteurs humains et matériels</text>
    <text x="20" y="185" font-size="11" fill="#334155">• Relations &lt;&lt;include&gt;&gt; et &lt;&lt;extend&gt;&gt;</text>
    <text x="20" y="205" font-size="11" fill="#334155">• Fiches de description textuelle</text>

    <rect x="20" y="222" width="220" height="18" rx="4" fill="#dbeafe"/>
    <text x="130" y="235" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">Module 02 &amp; TP 1</text>
  </g>

  <!-- Box 2: Classes -->
  <g transform="translate(320, 90)" filter="url(#sh)">
    <rect x="0" y="0" width="260" height="250" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="45" rx="12" fill="#059669"/>
    <text x="130" y="28" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">2. Diagramme de Classes</text>

    <text x="20" y="75" font-size="12" font-weight="700" fill="#064e3b">Rôle :</text>
    <text x="20" y="95" font-size="11" fill="#334155">Architecture statique orientée objet</text>
    <text x="20" y="110" font-size="11" fill="#334155">du code (firmware et logiciel).</text>

    <text x="20" y="145" font-size="12" font-weight="700" fill="#064e3b">Éléments Clés :</text>
    <text x="20" y="165" font-size="11" fill="#334155">• Encapsulation (+, -, #)</text>
    <text x="20" y="185" font-size="11" fill="#334155">• Héritage et polymorphisme</text>
    <text x="20" y="205" font-size="11" fill="#334155">• Agrégation et Composition</text>

    <rect x="20" y="222" width="220" height="18" rx="4" fill="#d1fae5"/>
    <text x="130" y="235" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">Module 03, 05 &amp; TP 2</text>
  </g>

  <!-- Box 3: Sequence -->
  <g transform="translate(610, 90)" filter="url(#sh)">
    <rect x="0" y="0" width="260" height="250" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="45" rx="12" fill="#7c3aed"/>
    <text x="130" y="28" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">3. Diagramme de Séquence</text>

    <text x="20" y="75" font-size="12" font-weight="700" fill="#581c87">Rôle :</text>
    <text x="20" y="95" font-size="11" fill="#334155">Dynamique temporelle des échanges</text>
    <text x="20" y="110" font-size="11" fill="#334155">inter-objets et protocoles réseaux.</text>

    <text x="20" y="145" font-size="12" font-weight="700" fill="#581c87">Éléments Clés :</text>
    <text x="20" y="165" font-size="11" fill="#334155">• Lignes de vie et activations</text>
    <text x="20" y="185" font-size="11" fill="#334155">• Messages synchrones/asynchrones</text>
    <text x="20" y="205" font-size="11" fill="#334155">• Fragments conditionnels (alt, loop)</text>

    <rect x="20" y="222" width="220" height="18" rx="4" fill="#ede9fe"/>
    <text x="130" y="235" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">Module 04 &amp; TP 3</text>
  </g>
</svg>