<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 380" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="475" y="35" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">Les 3 Relations Fondamentales entre Classes (UML)</text>

  <!-- SECTION 1: HERITAGE -->
  <g transform="translate(30, 60)" filter="url(#shadow)">
    <!-- Header -->
    <rect x="0" y="0" width="270" height="35" rx="6" fill="#1e293b" />
    <text x="135" y="23" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1. Héritage (Généralisation)</text>
    
    <!-- Mother Class -->
    <rect x="25" y="55" width="220" height="60" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
    <line x1="25" y1="80" x2="245" y2="80" stroke="#cbd5e1" stroke-width="1"/>
    <text x="135" y="73" text-anchor="middle" font-size="12" font-style="italic" font-weight="700" fill="#0f172a">&lt;&lt;Abstract&gt;&gt; Capteur</text>
    <text x="35" y="98" font-size="11" fill="#334155">+ acquerir() : float = 0</text>

    <!-- Arrow (Hollow Triangle pointing UP) -->
    <line x1="135" y1="160" x2="135" y2="135" stroke="#334155" stroke-width="2"/>
    <polygon points="135,115 125,135 145,135" fill="#ffffff" stroke="#334155" stroke-width="2" />

    <!-- Child Class -->
    <rect x="25" y="160" width="220" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
    <line x1="25" y1="185" x2="245" y2="185" stroke="#bfdbfe" stroke-width="1"/>
    <text x="135" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">CapteurTemperature</text>
    <text x="35" y="203" font-size="11" fill="#1e3a8a">+ acquerir() : float</text>

    <text x="135" y="250" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">Relation « Est un »</text>
    <text x="135" y="268" text-anchor="middle" font-size="11" fill="#64748b">C++ : class B : public A</text>
  </g>

  <!-- SECTION 2: AGREGATION -->
  <g transform="translate(340, 60)" filter="url(#shadow)">
    <!-- Header -->
    <rect x="0" y="0" width="270" height="35" rx="6" fill="#1e293b" />
    <text x="135" y="23" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2. Agrégation (Faible couplage)</text>

    <!-- Container Class -->
    <rect x="25" y="55" width="220" height="60" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
    <line x1="25" y1="80" x2="245" y2="80" stroke="#cbd5e1" stroke-width="1"/>
    <text x="135" y="73" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">PasserelleIoT</text>
    <text x="35" y="98" font-size="11" fill="#334155">+ connecter(c: Capteur*)</text>

    <!-- Hollow Diamond -->
    <polygon points="135,115 125,127 135,139 145,127" fill="#ffffff" stroke="#334155" stroke-width="2" />
    <line x1="135" y1="139" x2="135" y2="160" stroke="#334155" stroke-width="2"/>
    <text x="155" y="150" font-size="11" font-weight="700" fill="#0f172a">0..*</text>

    <!-- Element Class -->
    <rect x="25" y="160" width="220" height="60" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
    <line x1="25" y1="185" x2="245" y2="185" stroke="#bbf7d0" stroke-width="1"/>
    <text x="135" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Capteur</text>
    <text x="35" y="203" font-size="11" fill="#14532d">+ getValeur() : float</text>

    <text x="135" y="250" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">Cycles de vie indépendants</text>
    <text x="135" y="268" text-anchor="middle" font-size="11" fill="#64748b">C++ : std::vector&lt;Capteur*&gt;</text>
  </g>

  <!-- SECTION 3: COMPOSITION -->
  <g transform="translate(650, 60)" filter="url(#shadow)">
    <!-- Header -->
    <rect x="0" y="0" width="270" height="35" rx="6" fill="#1e293b" />
    <text x="135" y="23" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3. Composition (Forte / Cycle lié)</text>

    <!-- Container Class -->
    <rect x="25" y="55" width="220" height="60" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
    <line x1="25" y1="80" x2="245" y2="80" stroke="#cbd5e1" stroke-width="1"/>
    <text x="135" y="73" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">PasserelleIoT</text>
    <text x="35" y="98" font-size="11" fill="#334155">- m_afficheur : EcranOLED</text>

    <!-- Filled Diamond -->
    <polygon points="135,115 125,127 135,139 145,127" fill="#0f172a" stroke="#0f172a" stroke-width="2" />
    <line x1="135" y1="139" x2="135" y2="160" stroke="#0f172a" stroke-width="2"/>
    <text x="155" y="150" font-size="11" font-weight="700" fill="#0f172a">1</text>

    <!-- Component Class -->
    <rect x="25" y="160" width="220" height="60" rx="6" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5" />
    <line x1="25" y1="185" x2="245" y2="185" stroke="#fbcfe8" stroke-width="1"/>
    <text x="135" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#831843">EcranOLED</text>
    <text x="35" y="203" font-size="11" fill="#831843">+ afficherTexte(msg: string)</text>

    <text x="135" y="250" text-anchor="middle" font-size="11" font-weight="700" fill="#db2777">Cycle de vie lié (Détruit avec A)</text>
    <text x="135" y="268" text-anchor="middle" font-size="11" fill="#64748b">C++ : Objet membre direct</text>
  </g>
</svg>
