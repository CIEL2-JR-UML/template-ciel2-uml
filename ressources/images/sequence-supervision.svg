<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="sh3" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="msgArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="retArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Lifelines -->
  <!-- Tech -->
  <rect x="50" y="20" width="120" height="40" rx="6" fill="#1e293b" />
  <text x="110" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Technicien</text>
  <line x1="110" y1="60" x2="110" y2="430" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,5"/>

  <!-- IHM -->
  <rect x="250" y="20" width="120" height="40" rx="6" fill="#2563eb" />
  <text x="310" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">IHM : WebApp</text>
  <line x1="310" y1="60" x2="310" y2="430" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,5"/>

  <!-- Backend -->
  <rect x="470" y="20" width="140" height="40" rx="6" fill="#0f766e" />
  <text x="540" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Srv : Backend API</text>
  <line x1="540" y1="60" x2="540" y2="430" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,5"/>

  <!-- Database -->
  <rect x="710" y="20" width="130" height="40" rx="6" fill="#7c3aed" />
  <text x="775" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">BDD : SQLite</text>
  <line x1="775" y1="60" x2="775" y2="430" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,5"/>

  <!-- Activation bars -->
  <rect x="303" y="85" width="14" height="315" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
  <rect x="533" y="115" width="14" height="255" fill="#ccfbf1" stroke="#0f766e" stroke-width="1"/>
  <rect x="768" y="145" width="14" height="50" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>

  <!-- Messages -->
  <!-- 1. Click -->
  <line x1="110" y1="90" x2="303" y2="90" stroke="#2563eb" stroke-width="2" marker-end="url(#msgArr)"/>
  <text x="200" y="84" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">1. Cliquer sur "Générer Rapport"</text>

  <!-- 2. GET API -->
  <line x1="317" y1="120" x2="533" y2="120" stroke="#2563eb" stroke-width="2" marker-end="url(#msgArr)"/>
  <text x="425" y="114" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">2. GET /api/rapport?format=json</text>

  <!-- 3. SELECT SQL -->
  <line x1="547" y1="150" x2="768" y2="150" stroke="#2563eb" stroke-width="2" marker-end="url(#msgArr)"/>
  <text x="655" y="144" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">3. SELECT * FROM mesures</text>

  <!-- 4. Result SQL -->
  <line x1="768" y1="185" x2="547" y2="185" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#retArr)"/>
  <text x="655" y="180" text-anchor="middle" font-size="11" fill="#475569">4. Enregistrements bruts</text>

  <!-- ALT Fragment Box -->
  <rect x="230" y="215" width="620" height="175" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <rect x="230" y="215" width="65" height="24" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
  <text x="262" y="231" text-anchor="middle" font-size="11" font-weight="800" fill="#1e293b">alt</text>
  <text x="310" y="231" font-size="11" font-style="italic" fill="#0f766e">[Mesures disponibles]</text>

  <!-- Alt branch 1 -->
  <line x1="533" y1="260" x2="317" y2="260" stroke="#2563eb" stroke-width="2" marker-end="url(#msgArr)"/>
  <text x="425" y="254" text-anchor="middle" font-size="11" font-weight="600" fill="#0f766e">200 OK (Données JSON formatées)</text>

  <line x1="303" y1="285" x2="110" y2="285" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#retArr)"/>
  <text x="200" y="280" text-anchor="middle" font-size="11" fill="#1e293b">Affichage du graphique</text>

  <!-- Alt divider -->
  <line x1="230" y1="305" x2="850" y2="305" stroke="#64748b" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="245" y="323" font-size="11" font-style="italic" fill="#dc2626">[Aucune mesure trouvée]</text>

  <!-- Alt branch 2 -->
  <line x1="533" y1="345" x2="317" y2="345" stroke="#dc2626" stroke-width="1.8" marker-end="url(#msgArr)"/>
  <text x="425" y="340" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">404 Not Found</text>

  <line x1="303" y1="370" x2="110" y2="370" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#retArr)"/>
  <text x="200" y="365" text-anchor="middle" font-size="11" fill="#dc2626">Message : "Aucune donnée disponible"</text>
</svg>