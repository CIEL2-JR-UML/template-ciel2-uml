<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shuc" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="425" y="28" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Relations d'Inclusion (&lt;&lt;include&gt;&gt;) et d'Extension (&lt;&lt;extend&gt;&gt;)</text>

  <!-- LEFT: INCLUSION -->
  <g transform="translate(40, 45)" filter="url(#shuc)">
    <rect x="0" y="0" width="360" height="145" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
    <text x="180" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">1. Inclusion : &lt;&lt;include&gt;&gt; (Systématique)</text>

    <!-- Source Case -->
    <ellipse cx="90" cy="80" rx="75" ry="24" fill="#ffffff" stroke="#991b1b" stroke-width="1.8"/>
    <text x="90" y="84" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Modifier IP</text>

    <!-- Arrow Source -> Target -->
    <line x1="165" y1="80" x2="210" y2="80" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrRed)"/>
    <text x="188" y="72" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">&lt;&lt;include&gt;&gt;</text>

    <!-- Target Case (Included) -->
    <ellipse cx="280" cy="80" rx="65" ry="24" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="280" y="84" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">S'authentifier</text>

    <text x="180" y="130" text-anchor="middle" font-size="10.5" fill="#7f1d1d">A appelle obligatoirement B pour s'exécuter</text>
  </g>

  <!-- RIGHT: EXTENSION -->
  <g transform="translate(450, 45)" filter="url(#shuc)">
    <rect x="0" y="0" width="360" height="145" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="180" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">2. Extension : &lt;&lt;extend&gt;&gt; (Conditionnelle)</text>

    <!-- Base Case -->
    <ellipse cx="90" cy="80" rx="75" ry="24" fill="#ffffff" stroke="#1e40af" stroke-width="1.8"/>
    <text x="90" y="84" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Lire mesures</text>

    <!-- Arrow Ext -> Base -->
    <line x1="205" y1="80" x2="168" y2="80" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrBlue)"/>
    <text x="188" y="72" text-anchor="middle" font-size="10" font-weight="700" fill="#2563eb">&lt;&lt;extend&gt;&gt;</text>

    <!-- Extension Case -->
    <ellipse cx="280" cy="80" rx="72" ry="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="280" y="84" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Exporter en PDF</text>

    <text x="180" y="130" text-anchor="middle" font-size="10.5" fill="#1e3a8a">B s'exécute optionnellement selon le besoin</text>
  </g>
</svg>