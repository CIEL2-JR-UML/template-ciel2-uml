<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="sh" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
    </marker>
  </defs>

  <rect x="20" y="110" width="170" height="70" rx="8" fill="#1e293b" filter="url(#sh)"/>
  <text x="105" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Cahier des Charges</text>
  <text x="105" y="160" text-anchor="middle" font-size="11" fill="#94a3b8">Besoins du client</text>

  <line x1="190" y1="145" x2="230" y2="145" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="235" y="110" width="170" height="70" rx="8" fill="#2563eb" filter="url(#sh)"/>
  <text x="320" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Cas d'Utilisation</text>
  <text x="320" y="160" text-anchor="middle" font-size="11" fill="#bfdbfe">Qui fait quoi ?</text>

  <path d="M 405 130 L 445 75 L 470 75" fill="none" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M 405 160 L 445 215 L 470 215" fill="none" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Classes -->
  <rect x="475" y="45" width="170" height="60" rx="8" fill="#0f766e" filter="url(#sh)"/>
  <text x="560" y="73" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Diagramme de Classes</text>
  <text x="560" y="91" text-anchor="middle" font-size="11" fill="#ccfbf1">Structure du code</text>

  <!-- Sequence -->
  <rect x="475" y="185" width="170" height="60" rx="8" fill="#7c3aed" filter="url(#sh)"/>
  <text x="560" y="213" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Diagramme de Séquence</text>
  <text x="560" y="231" text-anchor="middle" font-size="11" fill="#ede9fe">Échanges temporels</text>

  <line x1="645" y1="75" x2="710" y2="125" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="645" y1="215" x2="710" y2="165" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Code final -->
  <rect x="715" y="110" width="180" height="70" rx="8" fill="#059669" filter="url(#sh)"/>
  <text x="805" y="142" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">Code C++ / Python</text>
  <text x="805" y="160" text-anchor="middle" font-size="11" fill="#d1fae5">Firmware &amp; Application</text>
