<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="sh2" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="inherit" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,1 8,5 0,9" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- System Boundary -->
  <rect x="260" y="40" width="380" height="400" rx="14" fill="#f8fafc" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="450" y="70" text-anchor="middle" font-size="14" font-weight="800" fill="#1e3a8a">Système : Station Météo Connectée</text>

  <!-- ACTORS LEFT -->
  <!-- User -->
  <circle cx="80" cy="120" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <line x1="80" y1="134" x2="80" y2="162" stroke="#1e293b" stroke-width="2"/>
  <line x1="60" y1="145" x2="100" y2="145" stroke="#1e293b" stroke-width="2"/>
  <line x1="80" y1="162" x2="65" y2="190" stroke="#1e293b" stroke-width="2"/>
  <line x1="80" y1="162" x2="95" y2="190" stroke="#1e293b" stroke-width="2"/>
  <text x="80" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Utilisateur Final</text>

  <!-- Technician -->
  <circle cx="80" cy="290" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <line x1="80" y1="304" x2="80" y2="332" stroke="#1e293b" stroke-width="2"/>
  <line x1="60" y1="315" x2="100" y2="315" stroke="#1e293b" stroke-width="2"/>
  <line x1="80" y1="332" x2="65" y2="360" stroke="#1e293b" stroke-width="2"/>
  <line x1="80" y1="332" x2="95" y2="360" stroke="#1e293b" stroke-width="2"/>
  <text x="80" y="380" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Technicien</text>

  <!-- Inheritance Tech -> User -->
  <line x1="80" y1="270" x2="80" y2="225" stroke="#475569" stroke-width="2" marker-end="url(#inherit)"/>

  <!-- ACTORS RIGHT -->
  <!-- Cloud Broker -->
  <rect x="730" y="110" width="130" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="795" y="133" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">&lt;&lt;Système distant&gt;&gt;</text>
  <text x="795" y="149" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Serveur Cloud MQTT</text>

  <!-- RTC Clock -->
  <rect x="730" y="290" width="130" height="50" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="795" y="313" text-anchor="middle" font-size="11" font-weight="700" fill="#854d0e">&lt;&lt;Horloge RTC&gt;&gt;</text>
  <text x="795" y="329" text-anchor="middle" font-size="12" font-weight="700" fill="#a16207">Timer Interne</text>

  <!-- USE CASES -->
  <!-- UC1: Consulter mesures -->
  <g filter="url(#sh2)">
    <ellipse cx="450" cy="115" rx="140" ry="24" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="450" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Consulter les températures en direct</text>
  </g>

  <!-- UC5: Filtrer -->
  <g filter="url(#sh2)">
    <ellipse cx="450" cy="185" rx="120" ry="22" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="450" y="190" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Filtrer l'historique par date</text>
  </g>

  <!-- UC2: Parametrer -->
  <g filter="url(#sh2)">
    <ellipse cx="450" cy="265" rx="130" ry="24" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="450" y="270" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Paramétrer le seuil d'alerte</text>
  </g>

  <!-- UC3: S'authentifier -->
  <g filter="url(#sh2)">
    <ellipse cx="450" cy="340" rx="100" ry="22" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="450" y="345" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">S'authentifier</text>
  </g>

  <!-- UC4: Publier Cloud -->
  <g filter="url(#sh2)">
    <ellipse cx="450" cy="405" rx="130" ry="22" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <text x="450" y="410" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">Publier les mesures vers le Cloud</text>
  </g>

  <!-- CONNECTIONS -->
  <!-- User to UC1 -->
  <line x1="125" y1="140" x2="310" y2="120" stroke="#334155" stroke-width="1.8"/>

  <!-- Tech to UC2 -->
  <line x1="125" y1="320" x2="320" y2="275" stroke="#334155" stroke-width="1.8"/>

  <!-- UC1 extend UC5 -->
  <line x1="450" y1="163" x2="450" y2="140" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="480" y="156" font-size="10" font-weight="600" fill="#64748b">&lt;&lt;extend&gt;&gt;</text>

  <!-- UC2 include UC3 -->
  <line x1="450" y1="289" x2="450" y2="317" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="480" y="307" font-size="10" font-weight="700" fill="#dc2626">&lt;&lt;include&gt;&gt;</text>

  <!-- RTC to UC4 and UC4 to Cloud -->
  <line x1="730" y1="335" x2="575" y2="395" stroke="#334155" stroke-width="1.8"/>
  <line x1="580" y1="405" x2="730" y2="155" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>