<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="sh5" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="actArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e40af" />
    </marker>
  </defs>

  <!-- Start -->
  <circle cx="380" cy="25" r="12" fill="#0f172a"/>
  <line x1="380" y1="37" x2="380" y2="60" stroke="#1e40af" stroke-width="2" marker-end="url(#actArr)"/>

  <!-- Action 1: Init -->
  <rect x="255" y="60" width="250" height="42" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" filter="url(#sh5)"/>
  <text x="380" y="86" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">Initialiser liaison UART &amp; capteurs</text>

  <line x1="380" y1="102" x2="380" y2="125" stroke="#1e40af" stroke-width="2" marker-end="url(#actArr)"/>

  <!-- Action 2: Acquerir -->
  <rect x="255" y="125" width="250" height="42" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" filter="url(#sh5)"/>
  <text x="380" y="151" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">Acquérir les tensions analogiques</text>

  <line x1="380" y1="167" x2="380" y2="190" stroke="#1e40af" stroke-width="2" marker-end="url(#actArr)"/>

  <!-- Decision -->
  <polygon points="380,190 440,215 380,240 320,215" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#sh5)"/>
  <text x="380" y="219" text-anchor="middle" font-size="11" font-weight="700" fill="#78350f">Tension &gt; Seuil ?</text>

  <!-- Branch Oui (Left) -->
  <path d="M 320 215 L 210 215 L 210 250" fill="none" stroke="#1e40af" stroke-width="2" marker-end="url(#actArr)"/>
  <text x="250" y="205" font-size="11" font-weight="700" fill="#dc2626">[Oui]</text>

  <rect x="90" y="250" width="240" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" filter="url(#sh5)"/>
  <text x="210" y="275" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">Déclencher alarme sonore &amp; SMS</text>

  <!-- Branch Non (Right) -->
  <path d="M 440 215 L 550 215 L 550 250" fill="none" stroke="#1e40af" stroke-width="2" marker-end="url(#actArr)"/>
  <text x="500" y="205" font-size="11" font-weight="700" fill="#059669">[Non]</text>

  <rect x="430" y="250" width="240" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" filter="url(#sh5)"/>
  <text x="550" y="275" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">Enregistrer mesure sur carte SD</text>

  <!-- FORK BAR -->
  <path d="M 210 290 L 210 320 L 300 320" fill="none" stroke="#1e40af" stroke-width="2"/>
  <path d="M 550 290 L 550 320 L 460 320" fill="none" stroke="#1e40af" stroke-width="2"/>
  <rect x="240" y="316" width="280" height="8" rx="4" fill="#0f172a"/>

  <!-- Parallel branches -->
  <path d="M 310 324 L 310 350" fill="none" stroke="#1e40af" stroke-width="2" marker-end="url(#actArr)"/>
  <rect x="220" y="350" width="180" height="38" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="310" y="374" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Mettre à jour écran OLED</text>

  <path d="M 450 324 L 450 350" fill="none" stroke="#1e40af" stroke-width="2" marker-end="url(#actArr)"/>
  <rect x="360" y="350" width="180" height="38" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="450" y="374" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Émettre trame radio LoRa</text>

  <!-- JOIN BAR -->
  <line x1="310" y1="388" x2="310" y2="415" stroke="#1e40af" stroke-width="2"/>
  <line x1="450" y1="388" x2="450" y2="415" stroke="#1e40af" stroke-width="2"/>
  <rect x="240" y="415" width="280" height="8" rx="4" fill="#0f172a"/>

  <!-- End -->
  <line x1="380" y1="423" x2="380" y2="450" stroke="#1e40af" stroke-width="2" marker-end="url(#actArr)"/>
  <circle cx="380" cy="460" r="12" fill="none" stroke="#0f172a" stroke-width="2"/>
  <circle cx="380" cy="460" r="7" fill="#0f172a"/>
</svg>